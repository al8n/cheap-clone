[package]
name = "cheap-clone-derive"
version = "1.0.0"
edition = "2021"
rust-version = "1.85.0"
description = "Derive macro for cheap-clone."
repository = "https://github.com/al8n/cheap-clone"
documentation = "https://docs.rs/cheap-clone"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["cheap-clone", "clone", "derive", "proc-macro", "implicit-clone"]
categories = ["development-tools", "rust-patterns"]

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3.5"
proc-macro2 = "1"
quote = "1"
syn = "2"
