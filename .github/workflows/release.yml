name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Optional tag to validate against the package version
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-and-dry-run:
    name: validate and publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust 1.95
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Install release validation tools
        run: |
          cargo +stable install --locked cargo-semver-checks --version 0.50.0
          cargo +stable install --locked cargo-deny --version 0.19.9
      - name: Validate tag, package version, and main
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          expected_version="0.3.2"
          package_version="$(cargo +1.95.0 metadata --no-deps --format-version=1 | jq -r '.packages[0].version')"
          if [[ "${package_version}" != "${expected_version}" ]]; then
            echo "::error::Expected package version ${expected_version}, found ${package_version}" >&2
            exit 1
          fi

          case "${GITHUB_EVENT_NAME}" in
            push)
              if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
                echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${package_version}" >&2
                exit 1
              fi

              git fetch --force --no-tags --depth=1 origin \
                '+refs/heads/main:refs/remotes/origin/main'
              tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
              main_commit="$(git rev-parse 'refs/remotes/origin/main^{commit}')"
              if [[ "${tag_commit}" != "${main_commit}" ]]; then
                echo "::error::Release tag must point to the current origin/main commit" >&2
                exit 1
              fi
              ;;
            workflow_dispatch)
              if [[ -n "${RELEASE_TAG}" && "${RELEASE_TAG}" != "v${package_version}" ]]; then
                echo "::error::Input tag ${RELEASE_TAG} does not match package version ${package_version}" >&2
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported release event ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac
      - name: Check semver compatibility
        run: >-
          cargo +1.95.0 semver-checks check-release
          --baseline-version 0.3.1 --release-type patch --all-features
      - name: Check dependency advisories
        run: cargo +1.95.0 deny --all-features check advisories
      - name: Package crate
        run: cargo +1.95.0 package --all-features
      - name: Validate publish
        run: cargo +1.95.0 publish --dry-run --all-features

  publish:
    name: publish crate
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: validate-and-dry-run
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust 1.95
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Verify release tag and main
        shell: bash
        run: |
          set -euo pipefail

          expected_version="0.3.2"
          package_version="$(cargo +1.95.0 metadata --no-deps --format-version=1 | jq -r '.packages[0].version')"
          if [[ "${package_version}" != "${expected_version}" || "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "::error::Release tag and package version do not match v${expected_version}" >&2
            exit 1
          fi

          git fetch --force --no-tags --depth=1 origin \
            '+refs/heads/main:refs/remotes/origin/main'
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          main_commit="$(git rev-parse 'refs/remotes/origin/main^{commit}')"
          if [[ "${tag_commit}" != "${main_commit}" ]]; then
            echo "::error::Release tag must point to the current origin/main commit" >&2
            exit 1
          fi
      - name: Check crates.io publication state
        id: publication_state
        shell: bash
        run: |
          set -euo pipefail

          package_name="cheap-clone"
          package_version="$(cargo +1.95.0 metadata --no-deps --format-version=1 | jq -r '.packages[0].version')"
          encoded_version="$(jq -rn --arg version "${package_version}" '$version | @uri')"
          response_file="$(mktemp "${RUNNER_TEMP}/crates-io-cheap-clone.XXXXXX.json")"
          trap 'rm -f "${response_file}"' EXIT

          if ! http_status="$(
            curl --silent --show-error --location \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              --user-agent "cheap-clone-release-workflow/${GITHUB_RUN_ID}" \
              "https://crates.io/api/v1/crates/${package_name}/${encoded_version}"
          )"; then
            echo "::error::Failed to query crates.io publication state" >&2
            exit 1
          fi

          case "${http_status}" in
            404)
              echo "already_published=false" >>"${GITHUB_OUTPUT}"
              ;;
            200)
              if ! jq -e \
                --arg version "${package_version}" \
                --arg repository "${GITHUB_REPOSITORY}" \
                --arg sha "${GITHUB_SHA}" \
                '
                  .version.num == $version
                  and .version.trustpub_data.provider == "github"
                  and .version.trustpub_data.repository == $repository
                  and .version.trustpub_data.sha == $sha
                  and .version.yanked == false
                ' \
                "${response_file}" >/dev/null; then
                echo "::error::Published crate metadata does not match this repository and commit" >&2
                exit 1
              fi

              echo "already_published=true" >>"${GITHUB_OUTPUT}"
              echo "${package_name} ${package_version} is already published by this repository at this commit"
              ;;
            *)
              echo "::error::Unexpected crates.io HTTP status ${http_status}" >&2
              exit 1
              ;;
          esac
      - name: Authenticate with crates.io
        id: crates-io-auth
        if: ${{ steps.publication_state.outputs.already_published == 'false' }}
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Publish cheap-clone
        if: ${{ steps.publication_state.outputs.already_published == 'false' }}
        run: cargo +1.95.0 publish --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  github-release:
    name: create GitHub release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify or create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          version_without_build="${version%%+*}"
          expected_prerelease=false
          if [[ "${version_without_build}" == *-* ]]; then
            expected_prerelease=true
          fi

          release_notes=$'- Replace the `paste` dependency with the maintained `pastey` package.\n- Add optional `smol-bytes` support; enabling it requires Rust 1.95.\n- Preserve the existing public API and default feature set; the base, default, no-default, and alloc configurations support Rust 1.77. Optional integrations follow their upstream effective MSRV, with smol_str_0_3 bounded to smol_str >=0.3.2, <0.3.4.'
          encoded_tag="$(jq -rn --arg tag "${tag}" '$tag | @uri')"
          response_file="$(mktemp "${RUNNER_TEMP}/github-release.XXXXXX.json")"
          trap 'rm -f "${response_file}"' EXIT

          if ! http_status="$(
            curl --silent --show-error \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --user-agent "cheap-clone-release-workflow/${GITHUB_RUN_ID}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${encoded_tag}"
          )"; then
            echo "::error::Failed to query GitHub release state" >&2
            exit 1
          fi

          case "${http_status}" in
            404)
              release_args=(--verify-tag --title "${tag}" --notes "${release_notes}")
              if [[ "${expected_prerelease}" == "true" ]]; then
                release_args+=(--prerelease)
              fi

              gh release create "${tag}" "${release_args[@]}"
              ;;
            200)
              if ! jq -e \
                --arg tag "${tag}" \
                --arg notes "${release_notes}" \
                --argjson expected_prerelease "${expected_prerelease}" \
                '
                  .tag_name == $tag
                  and .name == $tag
                  and .body == $notes
                  and .draft == false
                  and .prerelease == $expected_prerelease
                ' \
                "${response_file}" >/dev/null; then
                echo "::error::Existing GitHub release metadata does not match the release contract" >&2
                exit 1
              fi

              echo "GitHub release ${tag} already exists with the expected state"
              ;;
            *)
              echo "::error::Unexpected GitHub API HTTP status ${http_status}" >&2
              exit 1
              ;;
          esac
