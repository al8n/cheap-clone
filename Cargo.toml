[package]
name = "cheap-clone"
version = "0.3.2"
edition = "2021"
repository = "https://github.com/al8n/cheap-clone"
homepage = "https://github.com/al8n/cheap-clone"
documentation = "https://docs.rs/cheap-clone"
description = "A trait which indicates that such type can be cloned cheaply."
license = "MIT OR Apache-2.0"
rust-version = "1.77.0"

[features]
default = ["std"]
alloc = []
std = ["either?/default", "smol_str_0_3?/default", "smol_str_0_2?/default", "triomphe_0_1?/std", "faststr_0_2?/default", "smol_bytes_0_1?/std"]
smol_bytes_0_1 = ["dep:smol_bytes_0_1", "smol_bytes_0_1/alloc", "alloc"]
smol_bytes = ["smol_bytes_0_1"]

[dependencies]
paste = { package = "pastey", version = "0.2.3" }
seq-macro = "0.3"

among = { version = "0.2", default-features = false, optional = true }
bytes_1 = { package = "bytes", version = "1", default-features = false, optional = true }
either = { version = "1", default-features = false, optional = true }
smol_str_0_3 = { package = "smol_str", version = ">=0.3.2, <0.3.4", default-features = false, optional = true }
smol_str_0_2 = { package = "smol_str", version = "0.2", default-features = false, optional = true }
triomphe_0_1 = { package = "triomphe", version = "0.1", default-features = false, optional = true }
faststr_0_2 = { package = "faststr", version = "0.2", default-features = false, optional = true }
smol_bytes_0_1 = { package = "smol-bytes", version = "0.1.7", default-features = false, optional = true }

[dev-dependencies]
static_assertions = "1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
