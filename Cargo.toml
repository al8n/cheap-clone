[package]
name = "cheap-clone"
version = "1.0.0"
edition = "2024"
repository = "https://github.com/al8n/cheap-clone"
documentation = "https://docs.rs/cheap-clone"
description = "A trait which indicates that such a type can be cloned cheaply."
license = "MIT OR Apache-2.0"
rust-version = "1.85.0"

[workspace]
members = ["cheap-clone-derive"]
exclude = ["tests/fixtures"]
resolver = "3"

[features]
default = ["std"]
alloc = []
derive = ["dep:cheap-clone-derive"]
std = ["among_1?/default", "either_1?/default", "smol_str_0_3?/default", "smol_str_0_2?/default", "triomphe_0_1?/std", "faststr_0_2?/default", "smol-bytes_0_1?/std", "smol-bytes_0_2?/std"]

among_1 = ["dep:among_1"]
among = ["among_1"]

bytes_1 = ["dep:bytes_1", "alloc"]
bytes = ["bytes_1"]

either_1 = ["dep:either_1"]
either = ["either_1"]

faststr_0_2 = ["dep:faststr_0_2", "alloc"]
faststr = ["faststr_0_2"]

smol_str_0_3 = ["dep:smol_str_0_3", "alloc"]
smol_str_0_2 = ["dep:smol_str_0_2", "alloc"]
smol_str = ["smol_str_0_3"]

smol-bytes_0_1 = ["dep:smol-bytes_0_1", "smol-bytes_0_1/alloc", "alloc"]
smol-bytes_0_2 = ["dep:smol-bytes_0_2", "smol-bytes_0_2/alloc", "alloc"]
smol-bytes = ["smol-bytes_0_2"]

triomphe_0_1 = ["dep:triomphe_0_1", "alloc"]
triomphe = ["triomphe_0_1"]



[dependencies]
cheap-clone-derive = { version = "0.1", path = "cheap-clone-derive", optional = true }
paste = { package = "pastey", version = "0.2" }
seq-macro = "0.3"

among_1 = { package = "among", version = "1", default-features = false, optional = true }

bytes_1 = { package = "bytes", version = "1", default-features = false, optional = true }

either_1 = { package = "either", version = "1", default-features = false, optional = true }

faststr_0_2 = { package = "faststr", version = "0.2", default-features = false, optional = true }

smol_str_0_3 = { package = "smol_str", version = "0.3", default-features = false, optional = true }
smol_str_0_2 = { package = "smol_str", version = "0.2", default-features = false, optional = true }

smol-bytes_0_1 = { package = "smol-bytes", version = "0.1", default-features = false, optional = true }
smol-bytes_0_2 = { package = "smol-bytes", version = "0.2", default-features = false, optional = true }

triomphe_0_1 = { package = "triomphe", version = "0.1", default-features = false, optional = true }

[dev-dependencies]
static_assertions = "1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-semver-checks.lints]
# 0.50.0 treats the doc(hidden) __private re-export as sealing the original
# public trait. Keep the diagnostic visible until that false positive is fixed.
# The downstream manual implementation in tests/fixtures/renamed guards this API.
trait_newly_sealed = "warn"
